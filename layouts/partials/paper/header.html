<header class="site-header">
  <a class="site-title" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}<span class="title-dot" aria-hidden="true">.</span></a>
  <nav class="site-nav" aria-label="主导航">
    {{ range .Site.Menus.main }}
      {{ $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
      <a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}{{ if .Params.target }} target="{{ .Params.target }}" rel="noopener noreferrer"{{ end }}>{{ .Name }}{{ if .Params.target }}<span class="external-mark" aria-hidden="true">↗</span>{{ end }}</a>
    {{ end }}
    <a class="icon-button" href="{{ "search/" | relURL }}" aria-label="搜索文章">{{ partial "paper/icon.html" "search" }}</a>
    <button class="icon-button theme-toggle" type="button" aria-label="切换深色模式" hidden>
      <span class="moon-icon">{{ partial "paper/icon.html" "moon" }}</span>
      <span class="sun-icon">{{ partial "paper/icon.html" "sun" }}</span>
    </button>
  </nav>
</header>
