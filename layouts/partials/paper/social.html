<div class="social-links" aria-label="{{ T "social_links" }}">
  {{ range .Site.Params.social }}
    <a class="icon-button" href="{{ .url }}" aria-label="{{ .name }}">{{ partial "paper/icon.html" (.icon | default "link") }}</a>
  {{ end }}
  {{ if ne .Site.Params.chipaper.showRSS false }}{{ with .Site.Home.OutputFormats.Get "RSS" }}<a class="icon-button" href="{{ .RelPermalink }}" aria-label="{{ T "subscribe_rss" }}">{{ partial "paper/icon.html" "rss" }}</a>{{ end }}{{ end }}
</div>
