{{ define "main" }}
<section class="listing-page"><header class="page-header"><p class="eyebrow">SEARCH</p><h1>搜索<span class="accent">.</span></h1></header>
<form class="search-form" role="search"><label for="search-input">{{ if ne .Site.Params.chipaper.showTags false }}搜一搜文章、标签或正文{{ else }}搜一搜文章或正文{{ end }}</label><div class="search-field">{{ partial "paper/icon.html" "search" }}<input type="search" id="search-input" name="q" autocomplete="off" placeholder="比如：HomeLab、功耗、Linux" data-index="{{ "index.json" | relURL }}"></div></form>
<p id="search-status" class="muted" role="status" aria-live="polite">打几个字就开始。</p><ul class="post-list" id="search-results"></ul><noscript><p>没开 JavaScript 的话这里搜不了，可以直接看<a href="{{ partial "paper/post-section-url.html" . }}">文章列表</a>。</p></noscript></section>
{{ end }}
