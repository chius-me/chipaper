{{ define "main" }}
<section class="listing-page">
  <header class="page-header"><p class="eyebrow">SEARCH</p><h1>{{ .Title }}<span class="accent">.</span></h1></header>
  <form class="search-form" role="search">
    <label for="search-input">{{ if ne .Site.Params.chipaper.showTags false }}{{ T "search_label_tags" }}{{ else }}{{ T "search_label" }}{{ end }}</label>
    <div class="search-field">
      {{ partial "paper/icon.html" "search" }}
      <input type="search" id="search-input" name="q" autocomplete="off" placeholder="{{ T "search_placeholder" }}" data-index="{{ with .Site.Home.OutputFormats.Get "JSON" }}{{ .RelPermalink }}{{ end }}">
    </div>
  </form>
  <p id="search-status" class="muted" role="status" aria-live="polite">{{ T "search_idle" }}</p>
  <ul class="post-list" id="search-results"></ul>
  <noscript><p>{{ T "search_no_js" }} <a href="{{ partial "paper/post-section-url.html" . }}">{{ T "all_posts" }}</a></p></noscript>
</section>
{{ end }}
