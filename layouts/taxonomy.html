{{ define "main" }}
<section class="listing-page">
  <header class="page-header"><h1>{{ .Title }}<span class="accent" aria-hidden="true">.</span></h1></header>
  <ul class="all-tags">
    {{ range .Data.Terms.Alphabetical }}<li><a href="{{ .Page.RelPermalink }}"><span aria-hidden="true">#</span>{{ .Page.LinkTitle }} <span>{{ .Count }}</span></a></li>{{ end }}
  </ul>
</section>
{{ end }}
