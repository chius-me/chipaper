baseURL = "https://chius-me.github.io/chipaper/"
title = "Chipaper"
theme = "chipaper"
themesDir = "../.."
locale = "zh-CN"
defaultContentLanguage = "zh"
hasCJKLanguage = true
mainSections = ["posts"]
enableRobotsTXT = true
summaryLength = 80

[languages.zh]
  locale = "zh-CN"
  label = "简体中文"
  weight = 1

[languages.zh-tw]
  locale = "zh-TW"
  label = "繁體中文"
  weight = 2

[languages.zh-tw.params]
  description = "Chipaper 的示範站。單欄、等寬字，中文和英文寫在一起。"

[languages.zh-tw.params.chipaper]
  greeting = "你好"
  motto = "寫點中文，也寫點英文。"

[languages.en]
  locale = "en-US"
  label = "English"
  weight = 3
  hasCJKLanguage = false

[languages.en.params]
  description = "The Chipaper demo. One column, monospaced type, and Chinese and English side by side."

[languages.en.params.chipaper]
  greeting = "Hello"
  motto = "A little Chinese, a little English."

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[params]
  description = "Chipaper 的演示。单栏，等宽字，中文和英文写在一起。"

[params.author]
  name = "Chipaper"

[params.chipaper]
  greeting = "你好"
  motto = "写点中文，也写点英文。"
  recentCount = 7
  comments = false
  showRSS = true

[[params.social]]
  name = "GitHub"
  icon = "github"
  url = "https://github.com/chius-me/chipaper"

